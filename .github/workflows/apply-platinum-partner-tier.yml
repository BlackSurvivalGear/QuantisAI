name: Apply Platinum Partner Tier Updates

on:
  push:
    branches:
      - chore/platinum-partner-tier
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update-partner-tier:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/platinum-partner-tier

      - name: Apply partner tier changes
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          original = html

          # Gold Partner: 50% -> 40% in the Partner Programme only.
          gold_start = html.index("<!-- Gold -->")
          platinum_marker = html.index("<!-- Premium -->", gold_start)
          gold = html[gold_start:platinum_marker]
          gold = gold.replace(
              '<span class="text-4xl font-extrabold text-gray-400 block mt-1 font-mono">50%</span>',
              '<span class="text-4xl font-extrabold text-gray-400 block mt-1 font-mono">40%</span>',
              1,
          )
          gold = gold.replace(
              "Earn 50% recurring commission for 12 months.",
              "Earn 40% recurring commission for 12 months.",
              1,
          )
          html = html[:gold_start] + gold + html[platinum_marker:]

          # Gold Partner references elsewhere in the Partner Programme.
          html = html.replace(
              "Automatically unlock at 50 active subscribers, 50% recurring commission.",
              "Automatically unlock at 50 active subscribers, 40% recurring commission.",
              1,
          )
          html = html.replace(
              '<td class="p-2.5 font-bold text-white">Gold</td>\n                                    <td class="p-2.5 text-center text-brand-gold font-bold">50%</td>',
              '<td class="p-2.5 font-bold text-white">Gold</td>\n                                    <td class="p-2.5 text-center text-brand-gold font-bold">40%</td>',
              1,
          )

          # Rename the partner tier everywhere it is explicitly a Partner tier.
          html = html.replace("<!-- Premium -->", "<!-- Platinum -->", 1)
          html = html.replace("Premium Partner", "Platinum Partner")
          html = html.replace("Premium Partners", "Platinum Partners")
          html = html.replace("What makes Premium different?", "What makes Platinum different?")
          html = html.replace(
              '<td class="p-2.5 font-bold text-white">Premium</td>',
              '<td class="p-2.5 font-bold text-white">Platinum</td>',
              1,
          )

          # Platinum commission is visually platinum rather than QuantisAI blue/gold.
          platinum_start = html.index("<!-- Platinum -->")
          platinum_end = html.index("<!-- Timeline & Progress Widget Grid -->", platinum_start)
          platinum = html[platinum_start:platinum_end]
          platinum = platinum.replace(
              '<span class="text-4xl font-extrabold text-brand-gold block mt-1 font-mono">50%</span>',
              '<span class="text-4xl font-extrabold text-[#E5E4E2] block mt-1 font-mono">50%</span>',
              1,
          )
          html = html[:platinum_start] + platinum + html[platinum_end:]

          # Featured-tier CTA: invitation-only rather than information request.
          html = html.replace("Request Information", "Invite Only", 1)

          if html == original:
              raise SystemExit("No partner-tier changes were applied; aborting.")

          path.write_text(html, encoding="utf-8")
          print("Partner tier updates applied successfully.")

      - name: Commit application changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-platinum-partner-tier.yml
          git commit -m "feat: update partner tier naming and commissions"
          git push origin chore/platinum-partner-tier
